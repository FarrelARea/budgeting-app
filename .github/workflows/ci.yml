name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@budgeting/web...
      - run: pnpm turbo typecheck --filter=@budgeting/web...
      - run: pnpm turbo lint --filter=@budgeting/web...

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budgeting
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Apply migrations
        run: psql postgresql://postgres:postgres@localhost:5432/budgeting -f apps/api/migrations/000001_init.up.sql
        env:
          PGPASSWORD: postgres
      - working-directory: apps/api
        run: go vet ./... && go test ./...
